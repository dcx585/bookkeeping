name: Build Android APK

# 触发规则（2026-11-15 修订）
#  · push 到 master  → 只构建，产物进 Artifacts，供测试；不发布 Release
#  · push tag v*     → 正式发布：版本号取自 tag，进 Releases
#  · 手动 dispatch   → 构建但不发布
# ★ 之前是「每次 push 都自动算版本号 +0.1 并发布」，等于每个提交都是一个版本，
#   Release 历史全是噪音，版本号也不再代表「一个可交付的点」。
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'app.html'
      - 'js/**'
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
      - 'tools/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # 版本号：tag push 取 tag；否则 dev 版本（不进 Release）
      - name: Compute version
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"                    # 形如 v1.3
            NAME="${TAG#v}"
            MAJOR="${NAME%%.*}"
            MINOR="${NAME##*.}"
            if ! echo "$MAJOR" | grep -qE '^[0-9]+$' || ! echo "$MINOR" | grep -qE '^[0-9]+$'; then
              echo "::error::tag 必须是 v<主>.<次> 形式，当前是 $TAG"
              exit 1
            fi
            VC=$((MAJOR*1000 + MINOR*10 + 1))
            echo "IS_RELEASE=1" >> "$GITHUB_ENV"
          else
            NAME="0.0.${GITHUB_RUN_NUMBER}-dev"
            VC=$((GITHUB_RUN_NUMBER + 1))
            echo "IS_RELEASE=0" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$VC"   >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"
          echo "版本：$NAME（versionCode $VC）  发布：$([ "${GITHUB_REF_TYPE}" = tag ] && echo 是 || echo 否)"

      # 仓库本身就是 Android 项目（settings.gradle / app/build.gradle / Java 源码都在仓库里）。
      # ★ 2026-11-15：原来这 1400 行原生代码是塞在本 workflow 的 heredoc 里的 ——
      #   仓库里看不到、搜不到、IDE 打不开，改一个缩进就可能在 CI 静默炸。
      #   现在只做「把网页资源放进 assets」这一件事。
      - name: Stage web assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cp app.html app/src/main/assets/app.html
          # 已拆出的前端模块目录（目前 app.html 仍内联，留着以便后续拆分直接生效）
          if [ -d js ]; then
            mkdir -p app/src/main/assets/js
            cp -f js/*.js app/src/main/assets/js/ 2>/dev/null || true
          fi
          ls -R app/src/main/assets | head -30

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # 从 GitHub Secrets 还原 release keystore；密码通过 env 传入(避免shell解析特殊字符)
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          # 守卫：空 keystore 会让后面报一个看不懂的 ASN.1 错误
          #   （0 字节文件首字节读成 0xFF → "Tag number over 30 is not supported"）
          # 在这里直接判定，给出明确原因。
          if [ ! -s release.keystore ]; then
            echo "::error::release.keystore 是空的（0 字节）"
            echo "原因：Secret RELEASE_KEYSTORE_BASE64 不存在或为空"
            echo "修：仓库 Settings → Secrets and variables → Actions → 添加该 Secret"
            echo "    值 = keystore 的 base64（base64 -w0 xxx.keystore）"
            exit 1
          fi

          # 首字节检查：合法的 PKCS12 是 0x30，JKS 是 0xfe
          # 0x1f/0x3f/0x5f/0x7f/0x9f/0xbf/0xdf/0xff 都会被 JDK 拒掉
          FIRST=$(od -An -tx1 -N1 release.keystore | tr -d ' \n')
          echo "keystore 首字节: 0x$FIRST"
          case "$FIRST" in
            30*) ;;
            fe*) ;;
            *)
              echo "::error::release.keystore 首字节 0x$FIRST 不是合法的 keystore 格式"
              echo "合法值：0x30（PKCS12）或 0xfe（JKS）"
              exit 1
              ;;
          esac

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_PASSWORD 为空"
            exit 1
          fi

          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          ls -la release.keystore

      - name: Build APK (signed release)
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeping-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── 以下只在打 tag 时执行 ──
      - name: Publish APK to Release (versioned)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bookkeeping v${{ env.VERSION_NAME }}
          body: |
            ## Bookkeeping 记账 APK v${{ env.VERSION_NAME }}

            - 版本号 v${{ env.VERSION_NAME }}（versionCode ${{ env.VERSION_CODE }}）
            - 支持覆盖安装升级（无需卸载旧版）

            功能：
            - 支出/收入/转账记账 + 月度统计 + 分类占比
            - 自定义账户管理（现金+理财，均支持新增/删除）
            - 📥 自动记账：打开自动读取支付通知并入账
              · ≤¥30 且走微信/银行卡 → 静默自动入账
              · >¥30、专项资金(规划金/花呗/理财等)、识别不清 → 弹框确认
              · 智能拆单/智能判重：合并通知自动拆多笔、同交易不重复
            - 转账支持理财账户互转、理财↔现金互转，理财余额联动+历史记录
            - 流水显示每笔后账户余额变化
            - CSV 导入导出 + 剪贴板导入
            - 自定义图标 + 统一皮肤控件
            安装：下载 APK 后允许「安装未知应用」即可。
          files: app/build/outputs/apk/release/app-release.apk
          overwrite: false

      - name: Publish APK to Release (latest)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bookkeeping APK（最新版 v${{ env.VERSION_NAME }}）
          body: |
            ## Bookkeeping 记账 APK v${{ env.VERSION_NAME }}

            这是最新版（版本 v${{ env.VERSION_NAME }}）。可在 Releases 历史里下载旧版本。

            - 支持覆盖安装升级（无需卸载）
            - 自动记账 / 拆单判重 / 理财互转 / 流水余额 / 历史记录
            安装：下载 APK 后允许「安装未知应用」即可。
          files: app/build/outputs/apk/release/app-release.apk
          overwrite: true
