name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/minis/bookkeeping
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets
          cp app.html app/src/main/assets/app.html

      - name: Generate launcher icons
        run: |
          cd app/src/main/res
          # 墨绿背景色
          cat > values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#2B513C</color>
          </resources>
          EOF
          # 各密度全幅兜底图标（墨绿底+账本）
          mkdir -p mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi
          convert ${GITHUB_WORKSPACE}/icon_src/ic_launcher.png -resize 48x48   mipmap-mdpi/ic_launcher.png
          convert ${GITHUB_WORKSPACE}/icon_src/ic_launcher.png -resize 72x72   mipmap-hdpi/ic_launcher.png
          convert ${GITHUB_WORKSPACE}/icon_src/ic_launcher.png -resize 96x96   mipmap-xhdpi/ic_launcher.png
          convert ${GITHUB_WORKSPACE}/icon_src/ic_launcher.png -resize 144x144 mipmap-xxhdpi/ic_launcher.png
          convert ${GITHUB_WORKSPACE}/icon_src/ic_launcher.png -resize 192x192 mipmap-xxxhdpi/ic_launcher.png
          cp mipmap-mdpi/ic_launcher.png mipmap-mdpi/ic_launcher_round.png
          cp mipmap-hdpi/ic_launcher.png mipmap-hdpi/ic_launcher_round.png
          cp mipmap-xhdpi/ic_launcher.png mipmap-xhdpi/ic_launcher_round.png
          cp mipmap-xxhdpi/ic_launcher.png mipmap-xxhdpi/ic_launcher_round.png
          cp mipmap-xxxhdpi/ic_launcher.png mipmap-xxxhdpi/ic_launcher_round.png
          # adaptive foreground（108x108画布，符号居中）
          convert ${GITHUB_WORKSPACE}/icon_src/ic_foreground.png -resize 108x108 drawable/ic_launcher_foreground.png
          # adaptive icon XML
          cat > mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bookkeeping"
          include ':app'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.minis.bookkeeping'
              compileSdk 34
              defaultConfig {
                  applicationId "com.minis.bookkeeping"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Zhang"
                  android:theme="@style/Theme.Bookkeeping"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NotificationReaderService"
                      android:exported="false"
                      android:label="读取支付通知">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/minis/bookkeeping/MainActivity.java << 'JAVA'
          package com.minis.bookkeeping;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.File;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER = 10001;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              // ── JavaScript bridge: JS calls App.readClipboard() / App.fullscreen() etc ──
              public class AppBridge {
                  @JavascriptInterface
                  public String readClipboard() {
                      try {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          ClipData clip = cm.getPrimaryClip();
                          if (clip != null && clip.getItemCount() > 0) {
                              CharSequence txt = clip.getItemAt(0).getText();
                              return txt != null ? txt.toString() : "";
                          }
                          return "";
                      } catch (Exception e) { return ""; }
                  }
                  @JavascriptInterface
                  public String getClipboardText() {
                      return readClipboard();
                  }
                  @JavascriptInterface
                  public void notifyListen(String payload) {
                      final String orig = (payload == null) ? "" : payload;
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              Intent i = new Intent(NotificationReaderService.ACTION_SEND);
                              i.setClass(MainActivity.this, NotificationReaderService.class);
                              i.putExtra("payload", orig);
                              startService(i);
                          } catch (Exception ignored) {}
                      } });
                  }
                  @JavascriptInterface
                  public boolean hasNotifAccess() {
                      return NotificationReaderService.isEnabled(MainActivity.this);
                  }
                  @JavascriptInterface
                  public void openNotifSettings() {
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                          } catch (Exception e) {
                              try { startActivity(new Intent(Settings.ACTION_SETTINGS)); } catch (Exception ignored) {}
                          }
                      } });
                  }
                  @JavascriptInterface
                  public String readImportedTx() {
                      try {
                          File f = new File(getFilesDir(), "imported_tx.json");
                          if (f.exists()) {
                              java.io.FileInputStream fi = new java.io.FileInputStream(f);
                              byte[] b = new byte[(int) f.length()];
                              int off = 0;
                              while (off < b.length) {
                                  int r = fi.read(b, off, b.length - off);
                                  if (r < 0) break;
                                  off += r;
                              }
                              fi.close();
                              return new String(b, 0, off, "UTF-8");
                          }
                      } catch (Exception e) {}
                      return "[]";
                  }
                  @JavascriptInterface
                  public void triggerScan() {
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              Intent i = new Intent(NotificationReaderService.ACTION_SEND);
                              i.setClass(MainActivity.this, NotificationReaderService.class);
                              startService(i);
                          } catch (Exception ignored) {}
                      } });
                  }
                  @JavascriptInterface
                  public void toast(String msg) {
                      final String m = msg;
                      mainHandler.post(new Runnable() { public void run() {
                          android.widget.Toast.makeText(MainActivity.this, m, android.widget.Toast.LENGTH_SHORT).show();
                      } });
                  }
                  @JavascriptInterface
                  public boolean isFullscreen() {
                      return (getWindow().getAttributes().flags & WindowManager.LayoutParams.FLAG_FULLSCREEN) != 0;
                  }
                  @JavascriptInterface
                  public void setFullscreen(final boolean on) {
                      mainHandler.post(new Runnable() { public void run() {
                          if (on) {
                              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                      WindowManager.LayoutParams.FLAG_FULLSCREEN);
                              getWindow().getDecorView().setSystemUiVisibility(
                                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                          } else {
                              getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                          }
                      } });
                  }
              }
              private AppBridge appBridge;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setSupportZoom(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  appBridge = new AppBridge();
                  webView.addJavascriptInterface(appBridge, "MinisBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          Intent i = params.createIntent();
                          try { startActivityForResult(i, FILE_CHOOSER); return true; }
                          catch (Exception e) { filePathCallback = null; return false; }
                      }
                  });
                  webView.loadUrl("file:///android_asset/app.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == FILE_CHOOSER) {
                      Uri[] results = null;
                      if (res == RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          if (uri != null) results = new Uri[]{uri};
                      }
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onPause() { super.onPause(); webView.onPause(); }

              @Override
              protected void onResume() { super.onResume(); webView.onResume(); }

              @Override
              protected void onDestroy() {
                  webView.loadUrl("about:blank");
                  webView.clearHistory();
                  ((android.view.ViewGroup) webView.getParent()).removeView(webView);
                  webView.destroy();
                  super.onDestroy();
              }
          }
          JAVA

      - name: Create NotificationReaderService.java
        run: |
          cat > app/src/main/java/com/minis/bookkeeping/NotificationReaderService.java << 'JAVA'
          package com.minis.bookkeeping;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.util.Log;
          import java.io.File;
          import java.io.FileOutputStream;

          public class NotificationReaderService extends NotificationListenerService {
              public static final String ACTION_SEND = "com.minis.bookkeeping.SEND_PAYLOAD";
              private static final String TAG = "NotifReader";

              public static boolean isEnabled(Context ctx) {
                  String flat = Settings.Secure.getString(ctx.getContentResolver(), "enabled_notification_listeners");
                  return flat != null && flat.contains(ctx.getPackageName());
              }

              @Override
              public IBinder onBind(Intent intent) { return super.onBind(intent); }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try { dump(); } catch (Exception e) { Log.e(TAG, "dump err", e); }
              }
              @Override
              public void onNotificationRemoved(StatusBarNotification sbn) {
                  try { dump(); } catch (Exception e) { Log.e(TAG, "dump err", e); }
              }
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_SEND.equals(intent.getAction())) {
                      try { dump(); } catch (Exception e) { Log.e(TAG, "dump err", e); }
                  }
                  return START_STICKY;
              }

              private void dump() throws Exception {
                  StatusBarNotification[] sns = getActiveNotifications();
                  StringBuilder sb = new StringBuilder();
                  sb.append("[\n");
                  boolean first = true;
                  for (StatusBarNotification sbn : sns) {
                      Notification n = sbn.getNotification();
                      if (n == null || n.extras == null) continue;
                      String title = String.valueOf(n.extras.getCharSequence("android.title", ""));
                      String text = String.valueOf(n.extras.getCharSequence("android.text", ""));
                      String big = String.valueOf(n.extras.getCharSequence("android.bigText", ""));
                      if (title.equals("null")) title = "";
                      if (text.equals("null")) text = "";
                      if (big.equals("null")) big = "";
                      String combined = title + " | " + text + " " + big;
                      if (combined.trim().isEmpty()) continue;
                      if (!first) sb.append(",\n");
                      first = false;
                      sb.append("{\"app\":\"").append(sbn.getPackageName().replace("\"",""))
                        .append("\",\"title\":\"").append(esc(title))
                        .append("\",\"text\":\"").append(esc(text + " " + big)).append("\"}");
                  }
                  sb.append("\n]");
                  File f = new File(getFilesDir(), "imported_tx.json");
                  FileOutputStream fo = new FileOutputStream(f);
                  fo.write(sb.toString().getBytes("UTF-8"));
                  fo.close();
              }
              private String esc(String s) {
                  return s.replace("\\","\\\\").replace("\"","\\\"").replace("\n"," ").replace("\r"," ");
              }
          }
          JAVA

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zhang</string>
          </resources>
          EOF

      - name: Create theme
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Bookkeeping" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#f8f6f2</item>
                  <item name="android:statusBarColor">#f8f6f2</item>
                  <item name="android:navigationBarColor">#f8f6f2</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeping-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to Release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bookkeeping APK（最新版）
          body: |
            ## Bookkeeping 记账 APK

            最新构建自动发布。包含以下功能：
            - 支出/收入/转账记账 + 月度统计 + 分类占比
            - 自定义账户管理（现金+理财，可删除）
            - CSV 导入导出（含账户结构同步）
            - 从系统通知导入支付（需授权通知使用权）
            - 剪贴板导入
            - 自定义图标

            安装：下载 APK 后允许「安装未知应用」即可。
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
