name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compute version
        id: ver
        shell: bash
        run: |
          # 读取已有 release tags (v1.0/v1.1/v1.2...)，找最大版本号，下一个=最大+0.1
          TAGS=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | grep -oE '"tag_name"[^,]*"v[0-9]+\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+' || true)
          MAX_V=1.0
          for t in $TAGS; do
            MAJOR=$(echo "$t" | cut -d. -f1); MINOR=$(echo "$t" | cut -d. -f2)
            CMAJOR=$(echo "$MAX_V" | cut -d. -f1); CMINOR=$(echo "$MAX_V" | cut -d. -f2)
            if [ "$MAJOR" -gt "$CMAJOR" ] || { [ "$MAJOR" -eq "$CMAJOR" ] && [ "$MINOR" -gt "$CMINOR" ]; }; then MAX_V=$t; fi
          done
          MAJOR=$(echo "$MAX_V" | cut -d. -f1); MINOR=$(echo "$MAX_V" | cut -d. -f2)
          NEW_MINOR=$((MINOR+1))
          VER="${MAJOR}.${NEW_MINOR}"
          VC=$((MAJOR*1000 + NEW_MINOR*10 + 1))
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VER" >> "$GITHUB_ENV"
          echo "Computed version v$VER (versionCode $VC) from max tag $MAX_V"

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/minis/bookkeeping
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets
          cp app.html app/src/main/assets/app.html

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bookkeeping"
          include ':app'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.minis.bookkeeping'
              compileSdk 34
              defaultConfig {
                  applicationId "com.minis.bookkeeping"
                  minSdk 26
                  targetSdk 34
                  versionCode __VC__
                  versionName "__VERSION__"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE") ?: project.rootProject.file("missing.keystore"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "bookkeeping"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding "UTF-8"
              }
          }
          EOF

      - name: Inject version into gradle
        run: |
          sed -i 's/__VC__/'"$VERSION_CODE"'/g; s/__VERSION__/'"$VERSION_NAME"'/g' app/build.gradle
          echo "gradle version: $(grep -E 'versionCode|versionName' app/build.gradle)"

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="记账"
                  android:theme="@style/Theme.Bookkeeping"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NotificationReaderService"
                      android:exported="false"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:label="读取支付通知">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/minis/bookkeeping/MainActivity.java << 'JAVA'
          package com.minis.bookkeeping;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.content.ContentValues;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.File;
          import android.database.Cursor;
          import android.provider.Telephony;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER = 10001;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              // ── JavaScript bridge: JS calls App.readClipboard() / App.fullscreen() etc ──
              public class AppBridge {
                  private String esc(String s) {
                      if (s == null) return "";
                      return s.replace("\\", "\\\\").replace("\"", "\\\"")
                              .replace("\n", "\\n").replace("\r", "\\r")
                              .replace("\t", "\\t");
                  }
                  @JavascriptInterface
                  public String readClipboard() {
                      try {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          ClipData clip = cm.getPrimaryClip();
                          if (clip != null && clip.getItemCount() > 0) {
                              CharSequence txt = clip.getItemAt(0).getText();
                              return txt != null ? txt.toString() : "";
                          }
                          return "";
                      } catch (Exception e) { return ""; }
                  }
                  @JavascriptInterface
                  public String getClipboardText() {
                      return readClipboard();
                  }
                  @JavascriptInterface
                  public void notifyListen(String payload) {
                      final String orig = (payload == null) ? "" : payload;
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              Intent i = new Intent(NotificationReaderService.ACTION_SEND);
                              i.setClass(MainActivity.this, NotificationReaderService.class);
                              i.putExtra("payload", orig);
                              startService(i);
                          } catch (Exception ignored) {}
                      } });
                  }
                  @JavascriptInterface
                  public boolean hasNotifAccess() {
                      return NotificationReaderService.isEnabled(MainActivity.this);
                  }
                  @JavascriptInterface
                  public void openNotifSettings() {
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                          } catch (Exception e) {
                              try { startActivity(new Intent(Settings.ACTION_SETTINGS)); } catch (Exception ignored) {}
                          }
                      } });
                  }
                  @JavascriptInterface
                  public String readImportedTx() {
                      try {
                          // 走 svc.read()：与 readPendingTx 同源，且顺带把超过 7 天的条自动清除
                          return NotificationReaderService.queueRead(getFilesDir());
                      } catch (Exception e) { return "[]"; }
                  }
                  @JavascriptInterface
                  public String readSms() {
                      // 读短信：合并「收件箱(type=1)」与「全量(content://sms，不限 type)」两个查询。
                      // 【关键】只查 type=1 会漏掉 5G消息/富媒体/厂商特殊存储的银行通知——
                      //   这正是"明明有银行短信却读不到"的根因。且不能"第一个查到就 break"，
                      //   否则只要有一条普通短信兜底就永不执行。
                      try {
                          android.content.ContentResolver cr = getContentResolver();
                          String[] uris = {"content://sms/inbox", "content://sms"};
                          String[] sels = {"type=1", null};
                          java.util.HashSet<String> seen = new java.util.HashSet<>();
                          java.util.TreeMap<Long, java.util.List<String>> byDate =
                              new java.util.TreeMap<>(java.util.Collections.reverseOrder());
                          int total = 0;
                          for (int k = 0; k < uris.length; k++) {
                              android.database.Cursor c = null;
                              try {
                                  c = cr.query(android.net.Uri.parse(uris[k]),
                                          new String[]{"address","body","date"}, sels[k], null, "date DESC");
                              } catch (Exception ei) { c = null; }
                              if (c == null) continue;
                              int ia = c.getColumnIndex("address");
                              int ib = c.getColumnIndex("body");
                              int id = c.getColumnIndex("date");
                              int n = 0;
                              try {
                                  while (c.moveToNext() && n < 400) {
                                      n++; total++;
                                      if (ia < 0 || ib < 0 || id < 0) continue;
                                      String addr = c.getString(ia);
                                      String body = c.getString(ib);
                                      if (body == null) body = "";
                                      long date = c.getLong(id);
                                      String key = addr + "|" + date + "|" + body.hashCode();
                                      if (!seen.add(key)) continue;
                                      String json = "{\"address\":\"" + esc(String.valueOf(addr))
                                          + "\",\"body\":\"" + esc(body)
                                          + "\",\"date\":" + date + "}";
                                      java.util.List<String> bucket = byDate.get(date);
                                      if (bucket == null) { bucket = new java.util.ArrayList<String>(); byDate.put(date, bucket); }
                                      bucket.add(json);
                                  }
                              } catch (Exception e2) { }
                              try { c.close(); } catch (Exception e3) {}
                          }
                          StringBuilder sb = new StringBuilder("[\n");
                          int cnt = 0;
                          for (java.util.List<String> bucket : byDate.values()) {
                              for (String json : bucket) {
                                  if (cnt >= 200) break;
                                  if (cnt > 0) sb.append(",\n");
                                  sb.append(json);
                                  cnt++;
                              }
                              if (cnt >= 200) break;
                          }
                          sb.append("\n]");
                          return sb.toString();
                      } catch (Exception e) { return "[]"; }
                  }
                  @JavascriptInterface
                  public String notifEvidence() {
                      // 服务运行证据（key=value 文本）：收到多少通知、连过几次、扫描结果
                      try { return NotificationReaderService.evidenceRead(getFilesDir()); } catch (Exception e) { return ""; }
                  }
                  @JavascriptInterface
                  public String notifStatus() {
                      // 供 JS 显示「为什么没抓到」：是否授权 / 服务是否连接 / 队列条数
                      boolean granted = false, conn = false;
                      int qn = 0;
                      try { granted = NotificationReaderService.isEnabled(MainActivity.this); } catch (Exception e) {}
                      try { conn = NotificationReaderService.isConnected(); } catch (Exception e) {}
                      try {
                          String q = NotificationReaderService.queueRead(getFilesDir());
                          if (q != null && q.length() > 4) {
                              qn = q.split("\"nkey\"").length - 1;
                          }
                      } catch (Exception e) {}
                      return "{\"granted\":" + granted + ",\"connected\":" + conn + ",\"queue\":" + qn + "}";
                  }
                  @JavascriptInterface
                  public void requestRebind() {
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              if (android.os.Build.VERSION.SDK_INT >= 24) {
                                  android.service.notification.NotificationListenerService.requestRebind(
                                      new android.content.ComponentName(
                                          MainActivity.this, NotificationReaderService.class));
                              }
                          } catch (Exception ignored) {}
                      } });
                  }
                  @JavascriptInterface
                  public void triggerScan() {
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              Intent i = new Intent(NotificationReaderService.ACTION_SEND);
                              i.setClass(MainActivity.this, NotificationReaderService.class);
                              startService(i);
                          } catch (Exception e) {
                              // 不再静默：写进证据，否则"扫描没反应"永远查不出来
                              try { NotificationReaderService.evSet(getFilesDir(), "lastTriggerErr", String.valueOf(e)); } catch (Exception ignored) {}
                          }
                      } });
                  }
                  @JavascriptInterface
                  public void saveText(String filename, String content) {
                      final String fn = filename;
                      final String body = content == null ? "" : content;
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              saveToDownloads(fn, body);
                              android.widget.Toast.makeText(MainActivity.this, "已保存到 下载/" + fn, android.widget.Toast.LENGTH_LONG).show();
                          } catch (Exception e) {
                              android.widget.Toast.makeText(MainActivity.this, "保存失败: " + e.getMessage(), android.widget.Toast.LENGTH_LONG).show();
                          }
                      } });
                  }
                  @JavascriptInterface
                  public void toast(String msg) {
                      final String m = msg;
                      mainHandler.post(new Runnable() { public void run() {
                          android.widget.Toast.makeText(MainActivity.this, m, android.widget.Toast.LENGTH_SHORT).show();
                      } });
                  }
                  @JavascriptInterface
                  public boolean isFullscreen() {
                      return (getWindow().getAttributes().flags & WindowManager.LayoutParams.FLAG_FULLSCREEN) != 0;
                  }
                  @JavascriptInterface
                  public void setFullscreen(final boolean on) {
                      mainHandler.post(new Runnable() { public void run() {
                          if (on) {
                              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                      WindowManager.LayoutParams.FLAG_FULLSCREEN);
                              getWindow().getDecorView().setSystemUiVisibility(
                                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                          } else {
                              getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                          }
                      } });
                  }
                  @JavascriptInterface
                  public String readPendingTx() {
                      try {
                          return NotificationReaderService.queueRead(getFilesDir());
                      } catch (Exception e) { return "[]"; }
                  }
                  @JavascriptInterface
                  public void ackPendingTx(String idsJson) {
                      final String ids = idsJson == null ? "[]" : idsJson;
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              org.json.JSONArray arr = new org.json.JSONArray(ids);
                              String[] list = new String[arr.length()];
                              for (int i=0;i<arr.length();i++) list[i]=arr.getString(i);
                              NotificationReaderService.queueAck(getFilesDir(), list);
                          } catch (Exception ignored) {}
                      } });
                  }
                  // 通用状态持久化(应用内部私有目录)：给 JS 存「已处理集合」「滞留箱」等，
                  // 清缓存/重装不丢，也不导出到下载目录
                  @JavascriptInterface
                  public String readState(String name) {
                      try {
                          File f = new File(getFilesDir(), "state_" + (name == null ? "x" : name) + ".json");
                          if (!f.exists()) return "";
                          return NotificationReaderService.readText(f);
                      } catch (Exception e) { return ""; }
                  }
                  @JavascriptInterface
                  public void writeState(String name, String content) {
                      final String nm = (name == null ? "x" : name);
                      final String ct = content == null ? "" : content;
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              NotificationReaderService.writeText(
                                  new File(getFilesDir(), "state_" + nm + ".json"), ct);
                          } catch (Exception ignored) {}
                      } });
                  }
              }
              private AppBridge appBridge;

              // 保存文本到系统"下载"目录（Android 10+ 用 MediaStore，免存储权限）
              private void saveToDownloads(String filename, String content) throws Exception {
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "text/csv");
                      cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/");
                      cv.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      android.net.Uri uri = getContentResolver().insert(MediaStore.Downloads.getContentUri("external"), cv);
                      if (uri != null) {
                          java.io.OutputStream os = getContentResolver().openOutputStream(uri);
                          os.write(content.getBytes("UTF-8"));
                          os.close();
                          cv.clear();
                          cv.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          getContentResolver().update(uri, cv, null, null);
                          return;
                      }
                  }
                  // 兼容 Android 9-：写公共下载目录
                  java.io.File dir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS);
                  if (!dir.exists()) dir.mkdirs();
                  java.io.File f = new java.io.File(dir, filename);
                  java.io.FileOutputStream fo = new java.io.FileOutputStream(f);
                  fo.write(content.getBytes("UTF-8"));
                  fo.close();
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setSupportZoom(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  appBridge = new AppBridge();
                  webView.addJavascriptInterface(appBridge, "MinisBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          Intent i = params.createIntent();
                          try { startActivityForResult(i, FILE_CHOOSER); return true; }
                          catch (Exception e) { filePathCallback = null; return false; }
                      }
                  });
                  webView.loadUrl("file:///android_asset/app.html");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  // 权限结果不需要额外处理，readSms/读通知时若未授权会返回空，JS端可提示
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == FILE_CHOOSER) {
                      Uri[] results = null;
                      if (res == RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          if (uri != null) results = new Uri[]{uri};
                      }
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onPause() { super.onPause(); webView.onPause(); }

              @Override
              protected void onResume() {
                  super.onResume(); webView.onResume();
                  // 主动请求短信读取权限(银行/支付短信), 若未授权则提示授权
                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      try {
                          if (checkSelfPermission(android.Manifest.permission.READ_SMS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(new String[]{android.Manifest.permission.READ_SMS}, 1001);
                          }
                      } catch (Exception e) {}
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus && webView != null) {
                      // 每次回到前台都触发自动记账（处理新收到的支付通知）
                      mainHandler.postDelayed(new Runnable() { public void run() {
                          try { webView.evaluateJavascript("try{autoBookkeep()}catch(e){}", null); } catch (Exception ignored) {}
                      } }, 600);
                  }
              }

              @Override
              protected void onDestroy() {
                  webView.loadUrl("about:blank");
                  webView.clearHistory();
                  ((android.view.ViewGroup) webView.getParent()).removeView(webView);
                  webView.destroy();
                  super.onDestroy();
              }
          }
          JAVA

      - name: Create NotificationReaderService.java
        run: |
          cat > app/src/main/java/com/minis/bookkeeping/NotificationReaderService.java << 'JAVA'
          package com.minis.bookkeeping;
          import android.app.Notification;
          import android.content.Context;
          import android.content.Intent;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.util.Log;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.FileInputStream;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * 通知采集服务。
           *
           * ★ 修掉一条致命 bug（v1.15~v1.17 一直存在）：
           *   网页端桥接原先写的是 `new NotificationReaderService().read()`。
           *   但 Service 的文件 API（getFilesDir）依赖系统绑定时注入的 base Context；
           *   `new` 出来的实例 mBase == null → getFilesDir() 直接抛 NullPointerException
           *   → 被 catch 吞掉 → 网页端永远读到 "[]"、诊断证据永远全 0。
           *   表现就是：服务其实在正常收通知、正常写文件，但【读的人一开口就崩】。
           *
           *   修法：所有文件读写抽成 static + 显式 dir 参数。
           *     · 服务自身（已被绑定，有 Context）→ 传 getFilesDir()
           *     · 网页桥接（在 Activity 内，有 Context）→ 传 Activity 的 getFilesDir()
           *   两边都不再 new 服务实例。
           */
          public class NotificationReaderService extends NotificationListenerService {
              public static final String ACTION_SEND = "com.minis.bookkeeping.SEND_PAYLOAD";
              private static final String TAG = "NotifReader";
              private static final Object LOCK = new Object();

              /** 待处理条目的存活期：7 天后自动清除 */
              public static final long TTL_MS = 7L * 24 * 3600 * 1000;

              // ── 基础文件读写（静态、不依赖 Context）──────────────────
              public static String readText(File f) {
                  try {
                      if (f == null || !f.exists()) return "";
                      byte[] b = new byte[(int) Math.min(f.length(), 4L * 1024 * 1024)];
                      FileInputStream fi = new FileInputStream(f);
                      int off = 0, r;
                      while (off < b.length && (r = fi.read(b, off, b.length - off)) > 0) { off += r; }
                      fi.close();
                      return new String(b, 0, off, "UTF-8");
                  } catch (Exception e) { return ""; }
              }
              public static void writeText(File f, String s) {
                  try {
                      FileOutputStream fo = new FileOutputStream(f);
                      fo.write((s == null ? "" : s).getBytes("UTF-8"));
                      fo.close();
                  } catch (Exception e) {}
              }
              private static File qfOf(File dir) { return new File(dir, "imported_tx.json"); }
              private static File evOf(File dir) { return new File(dir, "notif_evidence.json"); }
              private static File seenOf(File dir) { return new File(dir, "seen_nkeys.json"); }

              // ── 队列：读（顺带清理超期）/ 追加 / 消费确认 ──────────────
              public static String queueRead(File dir) {
                  synchronized (LOCK) {
                      File qf = qfOf(dir);
                      if (!qf.exists()) return "[]";
                      String json = readText(qf);
                      long now = System.currentTimeMillis();
                      StringBuilder out = new StringBuilder("[");
                      boolean first = true, dropped = false;
                      Matcher m = Pattern.compile("\\{[^\\{\\}]*\\}").matcher(json);
                      while (m.find()) {
                          String obj = m.group();
                          Matcher tm = Pattern.compile("\"time\":(\\d+)").matcher(obj);
                          long t = tm.find() ? Long.parseLong(tm.group(1)) : now;
                          if (now - t > TTL_MS) { dropped = true; continue; }   // 超过7天 → 清除
                          if (!first) out.append(",");
                          first = false;
                          out.append(obj);
                      }
                      out.append("]");
                      String res = out.toString();
                      if (dropped) writeText(qf, res);
                      return res;
                  }
              }
              private static void queueAppend(File dir, String entry) {
                  synchronized (LOCK) {
                      File qf = qfOf(dir);
                      String pending = readText(qf).trim();
                      String next;
                      if (pending.isEmpty() || pending.equals("[]")) {
                          next = "[" + entry + "]";
                      } else {
                          String base = pending;
                          if (base.endsWith("]")) base = base.substring(0, base.length() - 1);
                          if (base.endsWith(",")) base = base.substring(0, base.length() - 1);
                          next = base + "," + entry + "]";
                      }
                      writeText(qf, next);
                  }
              }
              private static boolean queueHasNkey(File dir, String nkey) {
                  if (nkey == null) return false;
                  synchronized (LOCK) {
                      if (nkeyInSeen(dir, nkey)) return true;              // 已处理过 → 不再追加
                      String q = queueRead(dir);
                      return q.contains("\"nkey\":\"" + esc(nkey) + "\"");
                  }
              }
              /** 消费确认：删除指定 id，并把它们的 nkey 记入「已处理」，防止重复入队 */
              public static void queueAck(File dir, String[] ids) {
                  if (ids == null || ids.length == 0) return;
                  java.util.Set<String> set = new java.util.HashSet<>();
                  for (String i : ids) set.add(i);
                  synchronized (LOCK) {
                      File qf = qfOf(dir);
                      String json = readText(qf);
                      if (json.isEmpty()) return;
                      StringBuilder out = new StringBuilder("[");
                      boolean first = true;
                      Matcher m = Pattern.compile("\\{[^\\{\\}]*\\}").matcher(json);
                      while (m.find()) {
                          String obj = m.group();
                          boolean drop = false;
                          Matcher im = Pattern.compile("\"id\":\"([^\"]+)\"").matcher(obj);
                          if (im.find() && set.contains(im.group(1))) drop = true;
                          if (drop) {
                              Matcher nm = Pattern.compile("\"nkey\":\"([^\"]+)\"").matcher(obj);
                              if (nm.find()) markSeen(dir, nm.group(1));
                          } else {
                              if (!first) out.append(",");
                              first = false;
                              out.append(obj);
                          }
                      }
                      out.append("]");
                      writeText(qf, out.toString());
                  }
              }

              // ── 已处理集合（seen）─────────────────────────────────
              private static void markSeen(File dir, String nkey) {
                  if (nkey == null || nkey.isEmpty()) return;
                  synchronized (LOCK) {
                      File sf = seenOf(dir);
                      String cur = readText(sf);
                      long now = System.currentTimeMillis();
                      StringBuilder out = new StringBuilder("[");
                      boolean first = true, exists = false;
                      Matcher m = Pattern.compile("\\{[^\\{\\}]*\\}").matcher(cur);
                      while (m.find()) {
                          String obj = m.group();
                          Matcher tm = Pattern.compile("\"ts\":(\\d+)").matcher(obj);
                          long t = tm.find() ? Long.parseLong(tm.group(1)) : now;
                          if (now - t > TTL_MS) continue;                  // 超期清除
                          if (obj.contains("\"nkey\":\"" + esc(nkey) + "\"")) exists = true;
                          if (!first) out.append(",");
                          first = false;
                          out.append(obj);
                      }
                      out.append("]");
                      String next = out.toString();
                      if (!exists) {
                          String add = "{\"nkey\":\"" + esc(nkey) + "\",\"ts\":" + now + "}";
                          String base = next.endsWith("]") ? next.substring(0, next.length() - 1) : next;
                          if (base.endsWith(",")) base = base.substring(0, base.length() - 1);
                          next = base + "," + add + "]";
                      }
                      writeText(sf, next);
                  }
              }
              private static boolean nkeyInSeen(File dir, String nkey) {
                  if (nkey == null) return false;
                  synchronized (LOCK) {
                      String s = readText(seenOf(dir));
                      if (s.isEmpty()) return false;
                      long now = System.currentTimeMillis();
                      Matcher m = Pattern.compile("\\{[^\\{\\}]*\\}").matcher(s);
                      while (m.find()) {
                          String obj = m.group();
                          if (!obj.contains("\"nkey\":\"" + esc(nkey) + "\"")) continue;
                          Matcher tm = Pattern.compile("\"ts\":(\\d+)").matcher(obj);
                          if (tm.find()) {
                              try { if (now - Long.parseLong(tm.group(1)) > TTL_MS) return false; } catch (Exception ignored) {}
                          }
                          return true;
                      }
                      return false;
                  }
              }

              // ── 运行证据（用客观记录代替猜测）────────────────────────
              public static String evidenceRead(File dir) { return readText(evOf(dir)); }
              public static void evSet(File dir, String k, String v) {
                  synchronized (LOCK) {
                      java.util.HashMap<String, String> m = evMap(dir);
                      m.put(k, v);
                      evWrite(dir, m);
                  }
              }
              public static void evInc(File dir, String k, String tsKey) {
                  synchronized (LOCK) {
                      java.util.HashMap<String, String> m = evMap(dir);
                      int cur = 0; try { cur = Integer.parseInt(m.get(k)); } catch (Exception e) {}
                      m.put(k, String.valueOf(cur + 1));
                      if (tsKey != null) m.put(tsKey, String.valueOf(System.currentTimeMillis()));
                      evWrite(dir, m);
                  }
              }
              private static java.util.HashMap<String, String> evMap(File dir) {
                  java.util.HashMap<String, String> m = new java.util.HashMap<>();
                  String s = readText(evOf(dir));
                  for (String line : s.split("\n")) {
                      int i = line.indexOf('=');
                      if (i > 0) m.put(line.substring(0, i), line.substring(i + 1));
                  }
                  return m;
              }
              private static void evWrite(File dir, java.util.HashMap<String, String> m) {
                  StringBuilder sb = new StringBuilder();
                  for (java.util.Map.Entry<String, String> e : m.entrySet())
                      sb.append(e.getKey()).append('=').append(e.getValue()).append('\n');
                  writeText(evOf(dir), sb.toString());
              }
              /** 一条通知到达：记时间/来源/是否支付类 */
              private static void evRecordNotif(File dir, String app, boolean isPay) {
                  synchronized (LOCK) {
                      java.util.HashMap<String, String> m = evMap(dir);
                      m.put("lastNotifTs", String.valueOf(System.currentTimeMillis()));
                      m.put("lastNotifApp", app == null ? "" : app);
                      String ck = isPay ? "notifPay" : "notifNonPay";
                      int c = 0; try { c = Integer.parseInt(m.get(ck)); } catch (Exception e) {}
                      m.put(ck, String.valueOf(c + 1));
                      evWrite(dir, m);
                  }
              }

              // ── 判定 / 工具 ────────────────────────────────────────
              public static boolean isEnabled(Context ctx) {
                  try {
                      String flat = Settings.Secure.getString(ctx.getContentResolver(), "enabled_notification_listeners");
                      return flat != null && flat.contains(ctx.getPackageName());
                  } catch (Exception e) { return false; }
              }
              private static String hash(String s) {
                  long h = 1125899906842597L;
                  if (s == null) s = "";
                  for (int i = 0; i < s.length(); i++) h = 31 * h + s.charAt(i);
                  return Long.toHexString(h);
              }
              /** 支付类通知：必须同时有「金额」+「支付关键词」，聊天/新闻/验证码一律不入队 */
              private static boolean looksLikePayment(String title, String text) {
                  String s = ((title == null ? "" : title) + " " + (text == null ? "" : text)).trim();
                  if (s.length() < 4) return false;
                  boolean hasAmt = Pattern.compile(
                      "([\u00a5\uffe5]\\s?\\d)|(\\d[\\d,]*(\\.\\d{1,2})?\\s*\u5143)").matcher(s).find();
                  if (!hasAmt) return false;
                  return Pattern.compile(
                      "\u652f\u4ed8|\u6d88\u8d39|\u652f\u51fa|\u6536\u5165|\u5230\u8d26|\u6263\u6b3e|\u9000\u6b3e|\u8f6c\u8d26|\u6536\u6b3e|\u5165\u8d26|\u4ea4\u6613|\u4f59\u989d|\u4ed8\u6b3e|\u94f6\u884c\u5361|\u50a8\u84c4\u5361|\u4fe1\u7528\u5361|\u82b1\u5457|\u8fd8\u6b3e"
                  ).matcher(s).find();
              }
              private static String str(CharSequence cs) {
                  String v = cs == null ? "" : cs.toString();
                  return v.equals("null") ? "" : v;
              }
              private static String esc(String s) {
                  if (s == null) return "";
                  return s.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", " ").replace("\r", " ");
              }

              // ── 生命周期 ──────────────────────────────────────────
              @Override
              public IBinder onBind(Intent intent) { return super.onBind(intent); }

              public static volatile boolean sConnected = false;
              public static boolean isConnected() { return sConnected; }

              @Override
              public void onListenerConnected() {
                  super.onListenerConnected();
                  sConnected = true;
                  evInc(getFilesDir(), "connectCount", "lastConnectTs");
                  // 刚连上时补抓一次通知栏，避免断连期间漏掉的支付
                  try {
                      StatusBarNotification[] sns = getActiveNotifications();
                      if (sns != null) for (StatusBarNotification sbn : sns) appendNotification(sbn);
                  } catch (Exception e) { Log.e(TAG, "catchup err", e); }
              }

              @Override
              public void onListenerDisconnected() {
                  super.onListenerDisconnected();
                  sConnected = false;
                  evInc(getFilesDir(), "disconnectCount", "lastDisconnectTs");
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 24) {
                          requestRebind(new android.content.ComponentName(
                                  getApplicationContext(), NotificationReaderService.class));
                      }
                  } catch (Exception e) { Log.e(TAG, "rebind err", e); }
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try { appendNotification(sbn); } catch (Exception e) { Log.e(TAG, "queue err", e); }
              }
              @Override
              public void onNotificationRemoved(StatusBarNotification sbn) {
                  try { appendNotification(sbn); } catch (Exception e) { Log.e(TAG, "rm err", e); }
              }
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_SEND.equals(intent.getAction())) {
                      File dir = getFilesDir();
                      int active = -1; boolean nul = false;
                      try {
                          StatusBarNotification[] sns = getActiveNotifications();
                          if (sns == null) { nul = true; active = 0; }   // null = 服务未被系统绑定
                          else { active = sns.length; for (StatusBarNotification sbn : sns) appendNotification(sbn); }
                      } catch (Exception e) { Log.e(TAG, "full err", e); }
                      evSet(dir, "lastScanActive", String.valueOf(active));
                      evSet(dir, "lastScanNull", nul ? "1" : "0");
                      evInc(dir, "scanCount", "lastScanTs");
                  }
                  return START_STICKY;
              }

              /** 把一条通知追加进队列 */
              private void appendNotification(StatusBarNotification sbn) throws Exception {
                  Notification n = sbn.getNotification();
                  if (n == null || n.extras == null) return;
                  String title = str(n.extras.getCharSequence("android.title"));
                  String text = str(n.extras.getCharSequence("android.text"));
                  String big = str(n.extras.getCharSequence("android.bigText"));
                  String textLines = str(n.extras.getCharSequence("android.textLines"));
                  String sub = str(n.extras.getCharSequence("android.subText"));
                  String sum = str(n.extras.getCharSequence("android.summaryText"));
                  String fulltext = (textLines + " " + text + " " + big + " " + sub + " " + sum).trim();
                  String combined = title + " " + fulltext;
                  if (combined.trim().isEmpty()) return;
                  File dir = getFilesDir();
                  boolean isPay = looksLikePayment(title, fulltext);
                  evRecordNotif(dir, sbn.getPackageName(), isPay);   // 硬证据：确实收到过
                  if (!isPay) return;
                  // 唯一键 = 包名 | 通知id | 内容哈希。
                  // 只用 package|id 会被固定 id 的支付通知永久拦死（"第一条能记、之后全不来"）。
                  String nkey = sbn.getPackageName() + "|" + sbn.getId() + "|" + hash(title + "\u0001" + fulltext);
                  if (queueHasNkey(dir, nkey)) return;
                  String id = java.util.UUID.randomUUID().toString().substring(0, 8)
                            + "_" + System.currentTimeMillis();
                  String entry =
                        "{\"id\":\"" + id
                        + "\",\"nkey\":\"" + esc(nkey)
                        + "\",\"app\":\"" + esc(sbn.getPackageName())
                        + "\",\"title\":\"" + esc(title)
                        + "\",\"text\":\"" + esc(fulltext)
                        + "\",\"time\":" + System.currentTimeMillis() + "}";
                  queueAppend(dir, entry);
              }
          }
          JAVA
      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zhang</string>
          </resources>
          EOF

      - name: Create theme
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Bookkeeping" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#f8f6f2</item>
                  <item name="android:statusBarColor">#f8f6f2</item>
                  <item name="android:navigationBarColor">#f8f6f2</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # 从 GitHub Secrets 还原 release keystore；密码通过 env 传入(避免shell解析特殊字符)
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          ls -la release.keystore

      - name: Build APK (signed release)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeping-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish APK to Release (versioned history)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Bookkeeping v${{ env.VERSION_NAME }}
          body: |
            ## Bookkeeping 记账 APK v${{ env.VERSION_NAME }}

            - 版本号 v${{ env.VERSION_NAME }}（versionCode ${{ env.VERSION_CODE }}）
            - 支持覆盖安装升级（无需卸载旧版）

            功能：
            - 支出/收入/转账记账 + 月度统计 + 分类占比
            - 自定义账户管理（现金+理财，均支持新增/删除）
            - 📥 自动记账：打开自动读取支付通知并入账
              · ≤¥30 且走微信/银行卡 → 静默自动入账
              · >¥30、专项资金(规划金/花呗/理财等)、识别不清 → 弹框确认
              · 智能拆单/智能判重：合并通知自动拆多笔、同交易不重复
            - 转账支持理财账户互转、理财↔现金互转，理财余额联动+历史记录
            - 流水显示每笔后账户余额变化
            - CSV 导入导出 + 剪贴板导入
            - 自定义图标 + 统一皮肤控件
            安装：下载 APK 后允许「安装未知应用」即可。
          files: app/build/outputs/apk/release/app-release.apk
          overwrite: false
          generate_release_notes: false

      - name: Publish APK to Release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bookkeeping APK（最新版 v${{ env.VERSION_NAME }}）
          body: |
            ## Bookkeeping 记账 APK v${{ env.VERSION_NAME }}

            这是最新版（版本 v${{ env.VERSION_NAME }}）。可在 Releases 历史里下载旧版本。

            - 支持覆盖安装升级（无需卸载）
            - 自动记账 / 拆单判重 / 理财互转 / 流水余额 / 历史记录
            安装：下载 APK 后允许「安装未知应用」即可。
          files: app/build/outputs/apk/release/app-release.apk
          overwrite: true
          generate_release_notes: false
