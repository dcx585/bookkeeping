name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/minis/bookkeeping
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets
          cp app.html app/src/main/assets/app.html

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bookkeeping"
          include ':app'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.minis.bookkeeping'
              compileSdk 34
              defaultConfig {
                  applicationId "com.minis.bookkeeping"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="记账"
                  android:theme="@style/Theme.Bookkeeping"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NotificationReaderService"
                      android:exported="false"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:label="读取支付通知">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/minis/bookkeeping/MainActivity.java << 'JAVA'
          package com.minis.bookkeeping;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.content.ContentValues;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.File;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER = 10001;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              // ── JavaScript bridge: JS calls App.readClipboard() / App.fullscreen() etc ──
              public class AppBridge {
                  @JavascriptInterface
                  public String readClipboard() {
                      try {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          ClipData clip = cm.getPrimaryClip();
                          if (clip != null && clip.getItemCount() > 0) {
                              CharSequence txt = clip.getItemAt(0).getText();
                              return txt != null ? txt.toString() : "";
                          }
                          return "";
                      } catch (Exception e) { return ""; }
                  }
                  @JavascriptInterface
                  public String getClipboardText() {
                      return readClipboard();
                  }
                  @JavascriptInterface
                  public void notifyListen(String payload) {
                      final String orig = (payload == null) ? "" : payload;
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              Intent i = new Intent(NotificationReaderService.ACTION_SEND);
                              i.setClass(MainActivity.this, NotificationReaderService.class);
                              i.putExtra("payload", orig);
                              startService(i);
                          } catch (Exception ignored) {}
                      } });
                  }
                  @JavascriptInterface
                  public boolean hasNotifAccess() {
                      return NotificationReaderService.isEnabled(MainActivity.this);
                  }
                  @JavascriptInterface
                  public void openNotifSettings() {
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                          } catch (Exception e) {
                              try { startActivity(new Intent(Settings.ACTION_SETTINGS)); } catch (Exception ignored) {}
                          }
                      } });
                  }
                  @JavascriptInterface
                  public String readImportedTx() {
                      try {
                          File f = new File(getFilesDir(), "imported_tx.json");
                          if (f.exists()) {
                              java.io.FileInputStream fi = new java.io.FileInputStream(f);
                              byte[] b = new byte[(int) f.length()];
                              int off = 0;
                              while (off < b.length) {
                                  int r = fi.read(b, off, b.length - off);
                                  if (r < 0) break;
                                  off += r;
                              }
                              fi.close();
                              return new String(b, 0, off, "UTF-8");
                          }
                      } catch (Exception e) {}
                      return "[]";
                  }
                  @JavascriptInterface
                  public void triggerScan() {
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              Intent i = new Intent(NotificationReaderService.ACTION_SEND);
                              i.setClass(MainActivity.this, NotificationReaderService.class);
                              startService(i);
                          } catch (Exception ignored) {}
                      } });
                  }
                  @JavascriptInterface
                  public void saveText(String filename, String content) {
                      final String fn = filename;
                      final String body = content == null ? "" : content;
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              saveToDownloads(fn, body);
                              android.widget.Toast.makeText(MainActivity.this, "已保存到 下载/" + fn, android.widget.Toast.LENGTH_LONG).show();
                          } catch (Exception e) {
                              android.widget.Toast.makeText(MainActivity.this, "保存失败: " + e.getMessage(), android.widget.Toast.LENGTH_LONG).show();
                          }
                      } });
                  }
                  @JavascriptInterface
                  public void toast(String msg) {
                      final String m = msg;
                      mainHandler.post(new Runnable() { public void run() {
                          android.widget.Toast.makeText(MainActivity.this, m, android.widget.Toast.LENGTH_SHORT).show();
                      } });
                  }
                  @JavascriptInterface
                  public boolean isFullscreen() {
                      return (getWindow().getAttributes().flags & WindowManager.LayoutParams.FLAG_FULLSCREEN) != 0;
                  }
                  @JavascriptInterface
                  public void setFullscreen(final boolean on) {
                      mainHandler.post(new Runnable() { public void run() {
                          if (on) {
                              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                      WindowManager.LayoutParams.FLAG_FULLSCREEN);
                              getWindow().getDecorView().setSystemUiVisibility(
                                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                          } else {
                              getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                          }
                      } });
                  }
                  @JavascriptInterface
                  public String readPendingTx() {
                      try {
                          NotificationReaderService svc = new NotificationReaderService();
                          return svc.read();
                      } catch (Exception e) { return "[]"; }
                  }
                  @JavascriptInterface
                  public void ackPendingTx(String idsJson) {
                      final String ids = idsJson == null ? "[]" : idsJson;
                      mainHandler.post(new Runnable() { public void run() {
                          try {
                              org.json.JSONArray arr = new org.json.JSONArray(ids);
                              String[] list = new String[arr.length()];
                              for (int i=0;i<arr.length();i++) list[i]=arr.getString(i);
                              new NotificationReaderService().ack(list);
                          } catch (Exception ignored) {}
                      } });
                  }
              }
              private AppBridge appBridge;

              // 保存文本到系统"下载"目录（Android 10+ 用 MediaStore，免存储权限）
              private void saveToDownloads(String filename, String content) throws Exception {
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "text/csv");
                      cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/");
                      cv.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      android.net.Uri uri = getContentResolver().insert(MediaStore.Downloads.getContentUri("external"), cv);
                      if (uri != null) {
                          java.io.OutputStream os = getContentResolver().openOutputStream(uri);
                          os.write(content.getBytes("UTF-8"));
                          os.close();
                          cv.clear();
                          cv.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          getContentResolver().update(uri, cv, null, null);
                          return;
                      }
                  }
                  // 兼容 Android 9-：写公共下载目录
                  java.io.File dir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS);
                  if (!dir.exists()) dir.mkdirs();
                  java.io.File f = new java.io.File(dir, filename);
                  java.io.FileOutputStream fo = new java.io.FileOutputStream(f);
                  fo.write(content.getBytes("UTF-8"));
                  fo.close();
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setSupportZoom(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  appBridge = new AppBridge();
                  webView.addJavascriptInterface(appBridge, "MinisBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          Intent i = params.createIntent();
                          try { startActivityForResult(i, FILE_CHOOSER); return true; }
                          catch (Exception e) { filePathCallback = null; return false; }
                      }
                  });
                  webView.loadUrl("file:///android_asset/app.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == FILE_CHOOSER) {
                      Uri[] results = null;
                      if (res == RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          if (uri != null) results = new Uri[]{uri};
                      }
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onPause() { super.onPause(); webView.onPause(); }

              @Override
              protected void onResume() { super.onResume(); webView.onResume(); }

              @Override
              protected void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus && webView != null) {
                      // 每次回到前台都触发自动记账（处理新收到的支付通知）
                      mainHandler.postDelayed(new Runnable() { public void run() {
                          try { webView.evaluateJavascript("try{autoBookkeep()}catch(e){}", null); } catch (Exception ignored) {}
                      } }, 600);
                  }
              }

              @Override
              protected void onDestroy() {
                  webView.loadUrl("about:blank");
                  webView.clearHistory();
                  ((android.view.ViewGroup) webView.getParent()).removeView(webView);
                  webView.destroy();
                  super.onDestroy();
              }
          }
          JAVA

      - name: Create NotificationReaderService.java
        run: |
          cat > app/src/main/java/com/minis/bookkeeping/NotificationReaderService.java << 'JAVA'
          package com.minis.bookkeeping;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.util.Log;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.FileInputStream;
          import java.io.FileWriter;
          import java.io.RandomAccessFile;

          /**
           * 档次1：通知到达即实时入队（追加到 pending_tx.json 消费队列）。
           * 解析/判重/入账由网页端(JS)统一负责；此处只负责可靠采集 + 消费确认。
           */
          public class NotificationReaderService extends NotificationListenerService {
              public static final String ACTION_SEND = "com.minis.bookkeeping.SEND_PAYLOAD";
              private static final String TAG = "NotifReader";
              private static final Object LOCK = new Object();

              public static boolean isEnabled(Context ctx) {
                  String flat = Settings.Secure.getString(ctx.getContentResolver(), "enabled_notification_listeners");
                  return flat != null && flat.contains(ctx.getPackageName());
              }

              private File queueFile() { return new File(getFilesDir(), "imported_tx.json"); }

              @Override
              public IBinder onBind(Intent intent) { return super.onBind(intent); }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try { appendNotification(sbn); } catch (Exception e) { Log.e(TAG, "queue err", e); }
              }
              @Override
              public void onNotificationRemoved(StatusBarNotification sbn) {
                  // 移除时也补抓一次，避免重复清理导致丢失（JS 端会按 id 判重）
                  try { appendNotification(sbn); } catch (Exception e) { Log.e(TAG, "rm err", e); }
              }
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_SEND.equals(intent.getAction())) {
                      // 手动触发：全量入队一次（用于补漏），JS 判重会过滤
                      try {
                          StatusBarNotification[] sns = getActiveNotifications();
                          for (StatusBarNotification sbn : sns) appendNotification(sbn);
                      } catch (Exception e) { Log.e(TAG, "full err", e); }
                  }
                  return START_STICKY;
              }

              /** 把一条通知追加进队列（带唯一 id，供 JS 判重/确认） */
              private void appendNotification(StatusBarNotification sbn) throws Exception {
                  Notification n = sbn.getNotification();
                  if (n == null || n.extras == null) return;
                  String title = str(n.extras.getCharSequence("android.title"));
                  String text = str(n.extras.getCharSequence("android.text"));
                  String big = str(n.extras.getCharSequence("android.bigText"));
                  String combined = title + " | " + text + " " + big;
                  if (combined.trim().isEmpty()) return;
                  String id = java.util.UUID.randomUUID().toString().substring(0, 8)
                             + "_" + System.currentTimeMillis();
                  String entry =
                        "{\"id\":\"" + id
                        + "\",\"app\":\"" + esc(sbn.getPackageName())
                        + "\",\"title\":\"" + esc(title)
                        + "\",\"text\":\"" + esc(text + " " + big)
                        + "\",\"time\":" + System.currentTimeMillis() + "}";
                  synchronized (LOCK) {
                      File qf = queueFile();
                      StringBuilder cur = new StringBuilder("");
                      if (qf.exists()) {
                         byte[] b = new byte[(int) Math.min(qf.length(), 4*1024*1024)];
                         FileInputStream fi = new FileInputStream(qf);
                         int off=0, r; while(off<b.length && (r=fi.read(b,off,b.length-off))>0){off+=r;}
                         fi.close(); cur.append(new String(b,0,off,"UTF-8"));
                      }
                      String pending = cur.toString().trim();
                      String next;
                      if (pending.isEmpty() || pending.equals("[]")) {
                          next = "[" + entry + "]";
                      } else {
                          String base = pending;
                          if (base.endsWith("]")) base = base.substring(0, base.length()-1);
                          if (base.endsWith(",")) base = base.substring(0, base.length()-1);
                          next = base + "," + entry + "]";
                      }
                      FileOutputStream fo = new FileOutputStream(qf);
                      fo.write(next.getBytes("UTF-8"));
                      fo.close();
                  }
              }

              /** 读取队列全文 */
              public String read() throws Exception {
                  synchronized (LOCK) {
                      File qf = queueFile();
                      if (!qf.exists()) return "[]";
                      byte[] b = new byte[(int) Math.min(qf.length(), 4*1024*1024)];
                      FileInputStream fi = new FileInputStream(qf);
                      int off=0, r; while(off<b.length && (r=fi.read(b,off,b.length-off))>0){off+=r;}
                      fi.close();
                      return new String(b,0,off,"UTF-8");
                  }
              }

              /** 消费确认：删除指定 id 的条目 */
              public void ack(String[] ids) throws Exception {
                  if (ids == null) return;
                  java.util.Set<String> set = new java.util.HashSet<>();
                  for (String i : ids) set.add(i);
                  synchronized (LOCK) {
                      File qf = queueFile();
                      if (!qf.exists()) return;
                      byte[] b = new byte[(int) Math.min(qf.length(), 4*1024*1024)];
                      FileInputStream fi = new FileInputStream(qf);
                      int off=0, r; while(off<b.length && (r=fi.read(b,off,b.length-off))>0){off+=r;}
                      fi.close();
                      String json = new String(b,0,off,"UTF-8"); // [{...},{"id":"x"},...]
                      StringBuilder out = new StringBuilder("[");
                      boolean first=true;
                      // 简单按 {"id":...} 对象拆分过滤
                      int i=0; String s=json.trim();
                      if (s.startsWith("[")) s = s.substring(1);
                      if (s.endsWith("]")) s = s.substring(0, s.length()-1);
                      java.util.regex.Matcher m = java.util.regex.Pattern.compile("\\{[^\\{\\}]*\\}").matcher(s);
                      while (m.find()) {
                          String obj = m.group();
                          boolean drop=false;
                          java.util.regex.Matcher im = java.util.regex.Pattern.compile("\"id\":\"([^\"]+)\"").matcher(obj);
                          if (im.find() && set.contains(im.group(1))) drop=true;
                          if (!drop) {
                              if (!first) out.append(",");
                              first=false;
                              out.append(obj);
                          }
                      }
                      out.append("]");
                      FileOutputStream fo = new FileOutputStream(qf);
                      fo.write(out.toString().getBytes("UTF-8"));
                      fo.close();
                  }
              }

              private String str(CharSequence cs) {
                  String v = cs==null ? "" : cs.toString();
                  if (v.equals("null")) return "";
                  return v;
              }
              private String esc(String s) {
                  return s.replace("\\","\\\\").replace("\"","\\\"").replace("\n"," ").replace("\r"," ");
              }
          }
          JAVA
      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zhang</string>
          </resources>
          EOF

      - name: Create theme
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Bookkeeping" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#f8f6f2</item>
                  <item name="android:statusBarColor">#f8f6f2</item>
                  <item name="android:navigationBarColor">#f8f6f2</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeping-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to Release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bookkeeping APK（最新版）
          body: |
            ## Bookkeeping 记账 APK

            最新构建自动发布。包含以下功能：
            - 支出/收入/转账记账 + 月度统计 + 分类占比
            - 自定义账户管理（现金+理财，均支持新增/删除）
            - 📥 自动记账：打开自动读取支付通知并入账
              · ≤¥30 且走微信/银行卡 → 静默自动入账
              · >¥30、专项资金(规划金/花呗/理财等)、识别不清 → 弹框确认
              · 智能拆单：一条通知合并多笔 → 自动拆成多笔记账
              · 智能判重：同交易多条通知/同流水号不重复入账
            - CSV 导入导出（含账户结构同步）
            - 剪贴板导入
            - 自定义图标 + 统一皮肤控件
            - 自动记账专用确认框（可改账户/分类/金额）
            安装：下载 APK 后允许「安装未知应用」即可。
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
