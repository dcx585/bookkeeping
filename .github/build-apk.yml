name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/minis/bookkeeping
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets
          cp app.html app/src/main/assets/app.html

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'GRADLE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BookkeepingApp"
          include ':app'
          GRADLE_EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          GRADLE_EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'GRADLE_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          GRADLE_EOF

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.minis.bookkeeping'
              compileSdk 34
              defaultConfig {
                  applicationId "com.minis.bookkeeping"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE_EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Bookkeeping"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML_EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/minis/bookkeeping/MainActivity.java << 'JAVA_EOF'
          package com.minis.bookkeeping;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout decorView;
              private static final int FC_CODE = 10001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  decorView = (FrameLayout) getWindow().getDecorView();
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setSupportZoom(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  webView.addJavascriptInterface(new DlInterface(this), "Android");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView v, String url, Bitmap favicon) {
                          v.evaluateJavascript("window.__APP_VER__='v6'", null);
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          v.evaluateJavascript(DL_JS, null);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsAlert(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(msg)
                              .setPositiveButton("确定", (d, w) -> r.confirm())
                              .setOnCancelListener(d -> r.cancel())
                              .show();
                          return true;
                      }
                      @Override
                      public boolean onJsConfirm(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(msg)
                              .setPositiveButton("确定", (d, w) -> r.confirm())
                              .setNegativeButton("取消", (d, w) -> r.cancel())
                              .setOnCancelListener(d -> r.cancel())
                              .show();
                          return true;
                      }
                      @Override
                      public boolean onJsPrompt(WebView v, String url, String msg, String def, final JsPromptResult r) {
                          EditText input = new EditText(MainActivity.this);
                          input.setText(def);
                          input.selectAll();
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(msg)
                              .setView(input)
                              .setPositiveButton("确定", (d, w) -> r.confirm(input.getText().toString()))
                              .setNegativeButton("取消", (d, w) -> r.cancel())
                              .setOnCancelListener(d -> r.cancel())
                              .show();
                          return true;
                      }
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), FC_CODE);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = view;
                          customViewCallback = cb;
                          decorView.addView(view, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                      }
                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          decorView.removeView(customView);
                          customView = null;
                          if (customViewCallback != null) { customViewCallback.onCustomViewHidden(); customViewCallback = null; }
                      }
                  });
                  webView.loadUrl("file:///android_asset/app.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FC_CODE) {
                      Uri[] results = null;
                      if (res == RESULT_OK && data != null && data.getData() != null)
                          results = new Uri[]{data.getData()};
                      if (filePathCallback != null) { filePathCallback.onReceiveValue(results); filePathCallback = null; }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      decorView.removeView(customView);
                      customView = null;
                      if (customViewCallback != null) { customViewCallback.onCustomViewHidden(); customViewCallback = null; }
}else if(webView.canGoBack()){
webView.goBack()；
}else{
super.onBackPressed()；
                  }
              }

@覆写受保护的void onPause(){super.onPause()；webView.onPause()；}
@覆写受保护的void onResume(){super.onResume()；webView.onResume()；}
@Override protected void onDestroy(){
                  webView.loadUrl("about:blank");
webView.clearHistory()；
((ViewGroup)webView.getParent()).removeView(webView)；
webView.destroy()；
super.onDestroy()；
              }

